<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gustavo Freitas - Cybersecurity Visionary</title>
<meta name="description" content="Cybersecurity visionary. 10 years in the SOC. SOAR, incident response, GIAC GCIH. 20 things built. Build something loud.">
<meta property="og:title" content="Gustavo Freitas - Cybersecurity Visionary"><meta property="og:image" content="https://tootenramen.github.io/assets/shots/otto.jpg">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font:16px/1.5 Consolas,Menlo,monospace}
body{height:900vh}
#stars,#name{position:fixed;inset:0;width:100%;height:100%}
#stars{z-index:0}#name{z-index:3;pointer-events:none}
.stage{position:fixed;inset:0;z-index:2;perspective:900px;perspective-origin:50% 50%;overflow:hidden}
.tun{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.cd{position:absolute;left:50%;top:50%;width:min(46vw,640px);transform-style:preserve-3d;display:block;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.35);background:#000;box-shadow:0 0 60px rgba(0,229,255,.35),0 0 0 1px #000;backface-visibility:hidden}
.cd img{width:100%;display:block}.cd b{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:linear-gradient(transparent,#000d);font:900 clamp(18px,2.4vw,30px) Impact;letter-spacing:.1em;text-transform:uppercase}
.hud{position:fixed;z-index:5;left:0;right:0;pointer-events:none;text-align:center}
.top{top:3vh;display:flex;justify-content:space-between;padding:0 3vw;font-size:12px;letter-spacing:.3em;color:#7fe}
.hint{bottom:5vh;letter-spacing:.5em;font-size:12px;color:#ffd60a;animation:bl 1.5s infinite}@keyframes bl{50%{opacity:.2}}
.bar{position:fixed;left:0;top:0;height:4px;background:linear-gradient(90deg,#39ff8c,#00e5ff,#ffd60a,#ff2daa);z-index:9;width:0}
#intro{position:fixed;z-index:4;left:0;right:0;top:80%;text-align:center;pointer-events:none;transition:opacity .4s}
#intro div:first-child{letter-spacing:.7em;color:#ffd60a;font-size:clamp(11px,1.6vw,20px)}
#intro div:last-child{margin-top:8px;color:#7fe;letter-spacing:.3em;font-size:clamp(11px,1.3vw,16px)}
#vid{position:fixed;z-index:4;left:50%;top:50%;width:min(80vw,1100px);transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;border:2px solid #39ff8c;box-shadow:0 0 120px rgba(57,255,140,.5);transition:.3s}
#end{position:fixed;z-index:6;inset:0;display:grid;place-items:center;text-align:center;opacity:0;pointer-events:none}
#end h2{margin:0;font:900 clamp(56px,13vw,230px)/.9 Impact,'Arial Black',sans-serif;text-transform:uppercase;color:#ffd60a;text-shadow:0 0 60px rgba(255,214,10,.8),6px 0 #ff2daa,-6px 0 #00e5ff}
#end a{pointer-events:auto;display:inline-block;margin-top:3vh;color:#000;background:#39ff8c;padding:16px 34px;font:900 24px Impact;letter-spacing:.1em;text-decoration:none}
#snd{position:fixed;z-index:8;right:3vw;bottom:4vh;background:#000a;color:#39ff8c;border:1px solid #39ff8c;padding:8px 14px;font:12px Consolas,monospace;letter-spacing:.2em;cursor:pointer;opacity:.85;transition:.3s}
noscript .ns{position:relative;z-index:9;padding:8vh 6vw;font:18px/2 Consolas,monospace}noscript a{color:#39ff8c}
#ring{position:fixed;z-index:5;left:50%;top:50%;width:10px;height:10px;border:4px solid #fff;border-radius:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none}
</style></head><body>
<canvas id="stars"></canvas><canvas id="name"></canvas>
<div class="bar" id="bar"></div>
<div class="hud top"><span>GUSTAVO FREITAS</span><span id="sec">00 / ARRIVAL</span><span>10 YEARS IN</span></div>
<div id="intro"><div>CYBERSECURITY VISIONARY</div><div>SOAR // INCIDENT RESPONSE // GIAC GCIH</div></div>
<div class="stage"><div class="tun" id="tun"></div></div>
<audio id="bgm" src="assets/music.m4a" loop preload="auto"></audio>
<video id="vid" src="assets/ad.mp4" muted loop playsinline></video>
<div id="ring"></div>
<div id="end"><div><h2>Build<br>something<br>loud.</h2><a href="https://github.com/Tootenramen">GITHUB.COM/TOOTENRAMEN</a></div></div>
<button id="snd">&#9632; MUTE</button>
<noscript><div class="ns"><h1>Gustavo Freitas</h1><p>Cybersecurity Visionary. 10 years in the SOC.</p><p><a href="https://github.com/Tootenramen">github.com/Tootenramen</a></p></div></noscript>
<div class="hud hint" id="hint">SCROLL TO WARP</div>
<script>
const P=[["otto","OTTO"],["drivethru-resume","DriveThru-Resume"],["fr33","FR33"],["power","POWER"],["fast","FAST"],["f33l","F33L"],["logsleuth","LogSleuth"],["breach-tabletop","Breach-Tabletop"],["qbr-studio","QBR-Studio"],["discovery-call-sim","Discovery-Call-Sim"],["human-uptime","Human-Uptime"],["night-shift-radio","Night-Shift-Radio"],["goodnight-root","Goodnight-Root"],["zero-day-standup","Zero-Day-Standup"],["after-action","After-Action"],["buddy-pact","Buddy-Pact"],["soc-wall","SOC-Wall"],["hyperflow-playground","Hyperflow-Playground"],["neatbook-toolkit","NeatBook-Toolkit"],["packet-playbook","Packet-Playbook"]];
const GAP=950,START=1400,tun=document.getElementById('tun');
P.forEach(([s,n],i)=>{const a=document.createElement('a');a.className='cd';a.href='https://tootenramen.github.io/'+n+'/';const side=i%2?1:-1,xo=side*(22+(i%3)*4),yo=((i*53)%30)-15;
 a.style.transform=`translate(-50%,-50%) translate3d(${xo}vw,${yo}vh,${-(START+i*GAP)}px) rotateY(${-side*18}deg)`;a.innerHTML=`<img src="assets/shots/${s}.jpg"><b>${n.replace(/-/g,' ')}</b>`;tun.appendChild(a)});
const TOTAL=START+P.length*GAP;
// stars
const sc=document.getElementById('stars'),sx=sc.getContext('2d');let W,H,S=[];function rs(){W=sc.width=innerWidth;H=sc.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<700;i++)S.push({x:(Math.random()-.5)*2200,y:(Math.random()-.5)*2200,z:Math.random()*1500,c:Math.random()>.85?"255,214,10":(Math.random()>.7?"0,229,255":"255,255,255")});
let p=0,tp=0,vel=0,last=0,pt=[];
// particle name
const nc=document.getElementById('name'),nx=nc.getContext('2d');
function buildName(){nc.width=innerWidth;nc.height=innerHeight;const o=document.createElement('canvas');o.width=nc.width;o.height=nc.height;const c=o.getContext('2d');
 const fs=Math.min(o.width*.17,260);c.fillStyle="#fff";c.textAlign="center";c.font=`900 ${fs}px Impact,'Arial Black',sans-serif`;c.fillText("GUSTAVO",o.width/2,o.height*.45);c.fillText("FREITAS",o.width/2,o.height*.45+fs*.95);
 const d=c.getImageData(0,0,o.width,o.height).data,step=Math.max(4,Math.round(o.width/260));pt=[];
 for(let y=0;y<o.height;y+=step)for(let x=0;x<o.width;x+=step)if(d[(y*o.width+x)*4+3]>128){const lower=y>o.height*.45+5?1:0;pt.push({hx:x,hy:y,x:Math.random()*o.width,y:Math.random()*o.height,col:y<o.height*.45?"255,214,10":"255,255,255",r:step*.36})}}
buildName();addEventListener('resize',buildName);
let mx=-999,my=-999;addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
const q=new URLSearchParams(location.search),force=q.get('p');
function target(){const m=document.documentElement.scrollHeight-innerHeight;return force!==null?+force:scrollY/m}
const SEC=[[0,"00 / ARRIVAL"],[.06,"01 / THE WORK"],[.78,"02 / THE PITCH"],[.9,"03 / THE CALL"]];
const snd=document.getElementById('snd'),bgm=document.getElementById('bgm');let userMuted=false;
function startBgm(){if(userMuted||!bgm.paused)return;bgm.volume=.9;const r=bgm.play();if(r&&r.catch)r.catch(()=>{})}
startBgm();bgm.addEventListener('canplay',startBgm);
['pointerdown','pointermove','keydown','touchstart','touchend','click','wheel','scroll'].forEach(ev=>addEventListener(ev,startBgm,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden)bgm.pause();else startBgm()});
snd.onclick=e=>{e.stopPropagation();userMuted=!userMuted;if(userMuted){bgm.pause();snd.textContent='▶ SOUND ON'}else{startBgm();snd.textContent='■ MUTE'}};const vid=document.getElementById('vid'),ring=document.getElementById('ring'),end=document.getElementById('end');let boom=0;
(function f(t){const dt=Math.min(.05,(t-last)/1000||.016);last=t;tp=target();const np=force!==null?tp:p+(tp-p)*Math.min(1,dt*6);vel=(np-p)/Math.max(dt,.001);p=np;
 const sp=Math.abs(vel);
 // stars
 sx.fillStyle=`rgba(0,0,0,${.55-Math.min(.4,sp*2)})`;sx.fillRect(0,0,W,H);
 S.forEach(s=>{s.z-=2+sp*900+(p>.06?6:0);if(s.z<=1){s.z=1500;s.x=(Math.random()-.5)*2200;s.y=(Math.random()-.5)*2200}
  const k=420/s.z,X=W/2+s.x*k,Y=H/2+s.y*k,k2=420/(s.z+18+sp*700),X2=W/2+s.x*k2,Y2=H/2+s.y*k2;sx.strokeStyle=`rgba(${s.c},${Math.min(1,1.2-s.z/1500)})`;sx.lineWidth=Math.min(3,k*1.6);sx.beginPath();sx.moveTo(X2,Y2);sx.lineTo(X,Y);sx.stroke()});
 // tunnel
 const cardP=Math.min(1,Math.max(0,(p-.04)/.74));tun.style.transform=`translateZ(${cardP*(TOTAL-300)}px)`;
 tun.style.opacity=p>.78?Math.max(0,1-(p-.78)*18):1;
 // name particles
 const form=Math.max(0,1-p/.05);nx.clearRect(0,0,nc.width,nc.height);
 if(form>0.01){pt.forEach(a=>{const dx=mx-a.x,dy=my-a.y,d2=dx*dx+dy*dy;if(d2<14000){a.x-=dx*.08;a.y-=dy*.08}
  const e=force!==null?1:(p>0.001?.02:.07);a.x+=(a.hx-a.x)*e;a.y+=(a.hy-a.y)*e;
  const out=p>.001?(1-form):0;nx.fillStyle=`rgba(${a.col},${form})`;nx.fillRect(a.x+(a.hx-nc.width/2)*out*6*0,a.y,a.r*2,a.r*2)})}
 document.getElementById('intro').style.opacity=Math.max(0,1-p*30);document.getElementById('hint').style.opacity=p<.02?1:0;
 // ad video
 const vp=p>.78&&p<.9,vv=Math.max(0,Math.min(1,(p-.78)/.03));vid.style.opacity=p>.9?Math.max(0,1-(p-.9)*40):vv;vid.style.transform=`translate(-50%,-50%) scale(${.6+.4*vv})`;
 if(vp&&vid.paused)vid.play().catch(()=>{});if(!vp&&!vid.paused)vid.pause();
 // finale
 const ep=Math.max(0,Math.min(1,(p-.93)/.05));end.style.opacity=ep;end.style.transform=`scale(${1.4-.4*ep})`;end.style.pointerEvents=ep>.5?'auto':'none';
 if(ep>0&&boom==0){boom=1;ring.style.transition='none';ring.style.opacity=1;ring.style.width=ring.style.height='10px';requestAnimationFrame(()=>{ring.style.transition='all 1.1s ease-out';ring.style.width=ring.style.height='260vmax';ring.style.opacity=0})}
 if(ep==0)boom=0;
 let sec=SEC[0][1];SEC.forEach(([a,b])=>{if(p>=a)sec=b});document.getElementById('sec').textContent=sec;document.getElementById('bar').style.width=(p*100)+'%';
 requestAnimationFrame(f)})(0);
</script></body></html>
