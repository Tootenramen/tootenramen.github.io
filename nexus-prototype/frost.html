<!DOCTYPE html>
<html lang="en" class="frost">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nexus · Frost</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0}
  html,body{min-height:100%}
  body{font-family:'Inter',-apple-system,'SF Pro Display',system-ui,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,select,textarea{font:inherit;color:var(--text)}
  a{color:inherit;text-decoration:none}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(3%,-4%) scale(1.1)}}
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
  .a{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
  .d1{animation-delay:.05s}.d2{animation-delay:.18s}.d3{animation-delay:.3s}.d4{animation-delay:.42s}
  @media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}.orb{animation:none!important}}

  /* ---------- themes ---------- */
  html.frost{--bg:#eef1fb;--text:#1d1d1f;--muted:#6e6e73;--card:rgba(255,255,255,.58);--line:rgba(255,255,255,.9);--line2:rgba(0,0,0,.08);--hover:rgba(0,0,0,.05);--r:28px;--accent:#0071e3;--on-accent:#fff;--shadow:0 20px 50px rgba(80,90,150,.16),inset 0 1px 0 #fff;--bar:rgba(255,255,255,.6);--pop:rgba(255,255,255,.9);--ok:#1f9d55;--chip:rgba(0,113,227,.1)}
  html.lava{--bg:#000;--text:#fff;--muted:rgba(255,255,255,.62);--card:rgba(15,15,18,.42);--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.12);--hover:rgba(255,255,255,.09);--r:24px;--accent:#fff;--on-accent:#000;--shadow:inset 0 1px 0 rgba(255,255,255,.14);--bar:rgba(18,18,20,.5);--pop:rgba(24,24,28,.92);--ok:#4ade80;--chip:rgba(255,255,255,.12)}

  #bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
  .orb{position:absolute;border-radius:50%;filter:blur(90px);animation:drift 26s ease-in-out infinite}
  #frostbg,#lavabg{position:absolute;inset:0;transition:opacity .6s}
  html.frost #lavabg{opacity:0}html.lava #frostbg{opacity:0}
  #lavabg video{width:100%;height:100%;object-fit:cover}
  #lavabg i{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.9),rgba(0,0,0,.68) 45%,rgba(0,0,0,.3))}

  /* ---------- top bar ---------- */
  #top{position:fixed;top:0;left:0;right:0;height:64px;z-index:40;display:flex;align-items:center;gap:16px;padding:0 24px;background:var(--bar);backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);border-bottom:1px solid var(--line2)}
  .logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:1.05rem;letter-spacing:-.02em}
  .search{flex:1;max-width:380px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:.5rem .9rem;border-radius:999px;background:var(--hover);border:1px solid var(--line2);color:var(--muted);font-size:.85rem;transition:.2s}
  .search:hover{border-color:var(--muted)}
  .search span.k{margin-left:auto}
  .ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:.2s}
  .ibtn:hover{background:var(--hover);color:var(--text)}
  .ibtn svg{width:20px;height:20px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:.72rem;font-weight:600}
  .seg2{display:flex;padding:3px;border-radius:999px;background:var(--hover);border:1px solid var(--line2)}
  .seg2 button{padding:.3rem .75rem;border-radius:999px;font-size:.76rem;color:var(--muted);transition:.2s}
  .seg2 button.on{background:var(--accent);color:var(--on-accent);font-weight:500}

  /* ---------- page ---------- */
  #page{max-width:1040px;margin:0 auto;padding:96px 28px 170px}
  html.lava #page{padding-left:104px}
  .eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .muted{color:var(--muted)}
  h1.hi{font-weight:600;letter-spacing:-.035em;line-height:1.05;font-size:clamp(2.3rem,5vw,3.6rem)}
  h1.pt{font-weight:600;letter-spacing:-.03em;font-size:2rem;line-height:1.1}
  .head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}
  .head p{max-width:520px;margin-top:8px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g53{grid-template-columns:3fr 2fr}
  @media (max-width:800px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g53{grid-template-columns:1fr}#page{padding:92px 16px 160px}html.lava #page{padding-left:16px}.search{display:none}}

  .card{background:var(--card);backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
  .card.sm{padding:20px}
  .btn{display:inline-flex;align-items:center;gap:.4rem;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:.55rem 1.1rem;font-size:.85rem;font-weight:500;transition:.2s;white-space:nowrap}
  .btn:hover{filter:brightness(1.1);transform:scale(1.03)}
  .btn2{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;padding:.5rem 1rem;font-size:.82rem;transition:.2s;white-space:nowrap}
  .btn2:hover{background:var(--hover)}
  .stat b{display:block;font-size:2.1rem;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
  kbd{font-family:inherit;font-size:.7rem;padding:.08rem .42rem;border-radius:6px;border:1px solid var(--line2);background:var(--hover)}

  .tabs{display:flex;gap:2px;padding:4px;border-radius:14px;background:var(--hover);border:1px solid var(--line2);width:max-content;max-width:100%;flex-wrap:wrap;margin-bottom:22px}
  .tabs button{padding:.42rem .85rem;border-radius:10px;font-size:.8rem;color:var(--muted);transition:.2s}
  .tabs button:hover{color:var(--text)}.tabs button.on{background:var(--card);color:var(--text);box-shadow:0 1px 6px rgba(0,0,0,.15);font-weight:500}
  html.frost .tabs button.on{background:#fff}

  .step{display:flex;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid var(--line2)}
  .step:first-child{border-top:0}
  .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:600;border:1px solid var(--line2);flex:none}
  .step.now .num{background:var(--accent);color:var(--on-accent);border-color:transparent}
  .step.done .num{background:var(--ok);color:#fff;border-color:transparent}
  .step.done .t{text-decoration:line-through;opacity:.55}
  .helprow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line2);font-size:.88rem;cursor:pointer;width:100%;text-align:left}
  .helprow:first-of-type{border-top:0}.helprow:hover .ar{transform:translateX(3px)}.ar{transition:.2s;color:var(--muted)}
  .empty{text-align:center;padding:56px 24px}
  .empty .ico{width:64px;height:64px;border-radius:22px;margin:0 auto 18px;display:grid;place-items:center;background:var(--chip);color:var(--accent)}
  html.lava .empty .ico{color:#fff}
  .empty svg{width:28px;height:28px}
  .empty h3{font-size:1.25rem;font-weight:600;letter-spacing:-.02em}
  .empty p{max-width:440px;margin:8px auto 20px;color:var(--muted);font-size:.92rem;line-height:1.5}
  .li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-top:1px solid var(--line2)}
  .li:first-child{border-top:0}
  .pill{font-size:.7rem;padding:.15rem .55rem;border-radius:999px;background:var(--chip);font-weight:500}
  .pill.ok{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
  .setgrid{display:grid;grid-template-columns:190px 1fr;gap:20px}
  .setnav button{display:block;width:100%;text-align:left;padding:.5rem .8rem;border-radius:10px;font-size:.85rem;color:var(--muted);transition:.15s}
  .setnav button:hover{background:var(--hover);color:var(--text)}.setnav button.on{background:var(--hover);color:var(--text);font-weight:500}
  @media (max-width:800px){.setgrid{grid-template-columns:1fr}}
  .bars{display:flex;align-items:flex-end;gap:6px;height:110px;border-bottom:1px solid var(--line2);margin-top:18px}
  .bars i{flex:1;border-radius:6px 6px 0 0;background:var(--accent);min-height:3px;opacity:.9}
  .bars i.z{opacity:.18}
  .days{display:flex;gap:6px;font-size:.6rem;color:var(--muted);margin-top:4px}.days span{flex:1;text-align:center}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .filters span{padding:.35rem .8rem;border-radius:999px;font-size:.78rem;border:1px solid var(--line2);color:var(--muted)}

  /* ---------- nav: dock (frost) ---------- */
  .ni{position:relative}
  .tip{position:absolute;pointer-events:none;opacity:0;transition:.18s;z-index:60;white-space:nowrap;padding:.5rem .75rem;border-radius:12px;font-size:.75rem;line-height:1.35;background:rgba(28,28,30,.93);color:#fff;border:1px solid rgba(255,255,255,.14);text-align:left}
  .tip small{display:block;opacity:.65;font-size:.68rem;margin-top:1px}
  .ni:hover .tip{opacity:1}
  #dock{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:45;display:flex;align-items:flex-end;gap:10px;padding:10px 14px;border-radius:26px;background:var(--bar);backdrop-filter:blur(26px) saturate(1.8);border:1px solid var(--line);box-shadow:0 14px 40px rgba(60,70,130,.25)}
  #dock .ni{width:46px;height:46px;border-radius:28%;display:grid;place-items:center;color:var(--text);background:linear-gradient(160deg,rgba(255,255,255,.7),rgba(255,255,255,.3));border:1px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.08);transition:width .12s,height .12s,color .2s;flex:none;cursor:pointer}
  #dock .ni.on{background:var(--accent);color:var(--on-accent)}
  #dock .ni svg{width:52%;height:52%}
  #dock .tip{bottom:calc(100% + 16px);left:50%;transform:translateX(-50%)}
  html.lava #dock{display:none}
  /* ---------- nav: rail (lava) ---------- */
  #rail{position:fixed;left:18px;top:50%;transform:translateY(-50%);z-index:45;display:none;flex-direction:column;gap:4px;padding:8px;border-radius:26px;background:var(--bar);backdrop-filter:blur(26px) saturate(1.6);border:1px solid var(--line)}
  html.lava #rail{display:flex}
  #rail .ni{width:42px;height:42px;display:grid;place-items:center;border-radius:15px;color:rgba(255,255,255,.65);cursor:pointer;transition:.2s}
  #rail .ni:hover{background:rgba(255,255,255,.14);color:#fff}#rail .ni.on{background:#fff;color:#000}
  #rail svg{width:20px;height:20px}
  #rail .tip{left:calc(100% + 14px);top:50%;transform:translateY(-50%)}
  @media (max-width:800px){html.lava #rail{display:none}html.lava #dock{display:flex}}

  /* ---------- overlays ---------- */
  .scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);display:grid;place-items:start center;padding-top:14vh;animation:up .25s forwards}
  .sheet{width:min(480px,92vw);background:var(--pop);backdrop-filter:blur(40px) saturate(1.8);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 40px 90px rgba(0,0,0,.35);animation:pop .3s cubic-bezier(.2,.8,.2,1)}
  .sheet h3{font-size:1.2rem;font-weight:600;letter-spacing:-.02em}
  .fld{display:block;margin-top:14px;font-size:.78rem;color:var(--muted)}
  .fld input,.fld textarea,.fld select{display:block;width:100%;margin-top:6px;padding:.65rem .85rem;border-radius:12px;border:1px solid var(--line2);background:var(--hover);outline:none;font-size:.92rem}
  .fld input:focus,.fld textarea:focus{border-color:var(--accent)}
  .cmd{width:min(560px,92vw);padding:0;overflow:hidden}
  .cmd input{width:100%;padding:1.1rem 1.3rem;border:0;border-bottom:1px solid var(--line2);background:transparent;outline:none;font-size:1.02rem}
  .cmd .res{max-height:340px;overflow:auto;padding:8px}
  .cmd .res button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:.65rem .8rem;border-radius:12px;font-size:.9rem}
  .cmd .res button.on,.cmd .res button:hover{background:var(--hover)}
  .cmd .res small{margin-left:auto;color:var(--muted)}
  .cmd .res svg{width:18px;height:18px;color:var(--muted)}
  #pop{position:fixed;top:70px;right:20px;z-index:70;width:270px;background:var(--pop);backdrop-filter:blur(40px) saturate(1.8);border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:0 30px 70px rgba(0,0,0,.3);display:none;animation:pop .25s}
  #pop button{display:flex;justify-content:space-between;width:100%;padding:.65rem .8rem;border-radius:12px;font-size:.88rem;text-align:left}
  #pop button:hover{background:var(--hover)}
  #toast{position:fixed;top:78px;left:50%;transform:translateX(-50%) translateY(-10px);z-index:99;padding:.6rem 1.1rem;border-radius:999px;background:rgba(28,28,30,.92);color:#fff;font-size:.82rem;opacity:0;transition:.3s;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%)}

  /* ---------- tour ---------- */
  #tour{position:fixed;inset:0;z-index:90;display:none}
  #hole{position:fixed;border-radius:20px;box-shadow:0 0 0 9999px rgba(0,0,0,.58);transition:all .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
  #tcard{position:fixed;width:min(340px,90vw);background:var(--pop);backdrop-filter:blur(40px) saturate(1.8);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.45);transition:all .45s cubic-bezier(.2,.8,.2,1)}
  #tcard h4{font-size:1.05rem;font-weight:600;letter-spacing:-.02em}
  #tcard p{font-size:.88rem;color:var(--muted);line-height:1.5;margin-top:6px}
  .dots{display:flex;gap:5px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--line2)}.dots i.on{background:var(--accent);width:18px;border-radius:3px;transition:.3s}
</style>

<style>
#music{position:fixed;left:18px;bottom:18px;z-index:46;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:22px;background:var(--bar);backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.25);color:var(--text);font-family:inherit}
#music .vid{width:96px;height:54px;border-radius:14px;overflow:hidden;background:#000;flex:none;position:relative}
#music .vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
#music .meta{display:flex;flex-direction:column;min-width:0;max-width:130px}
#music .t{font-size:.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#music .a{font-size:.68rem;color:var(--muted);white-space:nowrap}
#mbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--hover);color:var(--text);display:grid;place-items:center;cursor:pointer;flex:none;transition:.2s}
#mbtn:hover{transform:scale(1.08)}
#mbtn svg{width:18px;height:18px}
@media(max-width:700px){#music{left:10px;bottom:96px;padding:6px 10px 6px 6px}#music .vid{width:72px;height:41px}#music .meta{max-width:92px}}
</style>
</head>
<body>

<div id="bg">
  <div id="frostbg"><div class="orb" style="width:520px;height:520px;background:#c7d2fe;left:-8%;top:-10%"></div><div class="orb" style="width:460px;height:460px;background:#fbcfe8;right:-6%;top:8%;animation-delay:-9s"></div><div class="orb" style="width:420px;height:420px;background:#bae6fd;left:38%;bottom:-14%;animation-delay:-16s"></div></div>
  <div id="lavabg"><video id="lava" muted loop playsinline preload="none" src="https://cdn.sceneai.art/Hero%20Section%20Video/50b4f304-cdca-4e12-8735-580d225834be.mp4"></video><i></i></div>
</div>

<header id="top">
  <a href="#/dashboard" class="logo"><svg width="26" height="26" viewBox="0 0 28 28" fill="none" stroke="#fca5a5" stroke-width="2"><circle cx="14" cy="14" r="11"/><circle cx="14" cy="14" r="5"/><path d="M14 3c4 4 4 18 0 22M3 14c4-4 18-4 22 0" stroke-linecap="round"/></svg>Nexus</a>
  <button class="search" id="searchBtn" data-act="cmd"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Search or jump to…<span class="k"><kbd>Ctrl</kbd> <kbd>K</kbd></span></button>
  
  <button class="ibtn" id="helpBtn" data-act="help" aria-label="Help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg></button>
  <div class="avatar">N</div>
</header>

<div id="pop"></div>
<nav id="dock" aria-label="Main"></nav>
<nav id="rail" aria-label="Main"></nav>
<main id="page"></main>
<div id="toast"></div>
<div id="tour"><div id="hole"></div><div id="tcard"></div></div>

<script>
/* ================= data ================= */
const ic = {
  Dashboard:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  Agents:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V5M9 14h.01M15 14h.01"/><circle cx="12" cy="4" r="1"/>',
  Context:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.2 7l7.6.8M7.5 8l3.5 8M16.8 10l-3.8 6.5"/>',
  Memory:'<path d="M9 3a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 3 4 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3zM15 3a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-3 4"/>',
  Files:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  Databases:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  Workflows:'<rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="15" width="6" height="6" rx="1.5"/><path d="M9 6h4a2 2 0 0 1 2 2v7"/>',
  Tickets:'<path d="M3 9V6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v3a3 3 0 0 0 0 6v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-3a3 3 0 0 0 0-6z"/>',
  Activity:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  Tools:'<path d="M14.7 6.3a4 4 0 0 0-5 5L3 18l3 3 6.7-6.7a4 4 0 0 0 5-5l-2.4 2.4-2.6-.6-.6-2.6z"/>',
  Settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>'
};
const desc = {Dashboard:'Overview of runs, spend and tickets',Agents:'Create AI agents with a role and tools',Context:'Maps of people, hosts and apps',Memory:'Shared memories your agents learn from',Files:'File stores with automatic expiry',Databases:'Knowledge bases and SQL data',Workflows:'Chain agents together on a canvas',Tickets:'Incidents, alerts and requests',Activity:'Every run, live',Tools:'MCP servers, triggers and secrets',Settings:'Providers, budgets and access'};
const names = Object.keys(ic);
const svg = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ic[n]}</svg>`;
const route = n => '#/' + n.toLowerCase();

const S = JSON.parse(localStorage.getItem('nexus-proto-frost') || 'null') || {theme:'frost',provider:null,tourDone:false,runs:[],data:{agents:[],context:[],memory:[],files:[],databases:[],workflows:[],tickets:[],tools:[]}};
const save = () => localStorage.setItem('nexus-proto-frost', JSON.stringify(S));

/* collection config for the simple pages */
const PAGES = {
  Agents:{desc:'Configure AI agents with a role, responsibilities, inputs, outputs and tools.',key:'agents',one:'agent',cta:'New agent',tabs:['Agents','Teams'],

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
const ago = t => { const s=Math.max(1,Math.round((Date.now()-t)/1000)); return s<60?s+'s ago':Math.round(s/60)+' min ago'; };

/* ================= nav ================= */
function buildNav(){
  const items = names.map(n=>`<a class="ni" href="${route(n)}" data-n="${n}" aria-label="${n}">${svg(n)}<span class="tip"><b>${n}</b><small>${desc[n]}</small></span></a>`).join('');
  $('#dock').innerHTML = items; $('#rail').innerHTML = items;
}
function markNav(cur){document.querySelectorAll('.ni').forEach(el=>el.classList.toggle('on',el.dataset.n===cur))}

/* dock magnification */
(function(){
  const dock=$('#dock'),B=46,M=78,R=120;
  const set=f=>dock.querySelectorAll('.ni').forEach(el=>el.style.width=el.style.height=f(el)+'px');
  dock.addEventListener('mousemove',e=>set(el=>{const r=el.getBoundingClientRect(),t=Math.max(0,1-Math.abs(e.clientX-(r.left+r.width/2))/R);return B+(M-B)*Math.sin(t*Math.PI/2)}));
  dock.addEventListener('mouseleave',()=>set(()=>B));
})();

/* ================= views ================= */
function head(title,sub,btns=''){return `<div class="head a d1"><div><p class="eyebrow">${title}</p><h1 class="pt" style="margin-top:6px">${title}</h1><p class="muted">${sub}</p></div><div class="row">${btns}</div></div>`}
const emptyIco = n => `<div class="ico">${svg(n)}</div>`;

function steps(){
  const done=[!!S.provider, S.data.agents.length>0, S.runs.length>0||S.data.workflows.length>0];
  const cur=done.findIndex(d=>!d);
  const def=[
    ['Connect an LLM provider','Add an API key for Anthropic, OpenAI, Google or any compatible endpoint. It lives in Settings → Providers.','Add provider','provider'],
    ['Create your first agent','Give it a role and responsibilities, pick a model and attach tools.','New agent','new-agent'],
    ['Run it, schedule it, or chain it','Run an agent by hand, on a schedule, from a webhook — or build a workflow.','Run my agent','run-first']];
  return {done,cur,def};
}
function viewDashboard(){
  const {done,cur,def}=steps(); const n=done.filter(Boolean).length;
  const runs=S.runs.length, open=S.data.tickets.length;
  const days=Array.from({length:14},(_,i)=>0); S.runs.forEach(r=>{const d=Math.min(13,Math.floor((Date.now()-r.t)/86400000)); days[13-d]++});
  const mx=Math.max(1,...days);
  return `
  <div class="a d1"><p class="eyebrow">Dashboard</p><h1 class="hi" style="margin-top:12px">Good afternoon,<br>there.</h1>
  <p class="muted" style="margin-top:14px;font-size:1.1rem;max-width:460px">${n===3?'You\'re all set. Your agents are ready whenever you are.':'Everything is set up and waiting. Three quick steps and your first agent is live.'}</p></div>

  <div class="card a d2" id="checklist" style="margin-top:36px">
    <div class="row" style="justify-content:space-between;align-items:flex-start;margin-bottom:6px">
      <div><p style="font-weight:600;font-size:1.1rem">Get started</p><p class="muted" style="font-size:.85rem;margin-top:3px">${n} of 3 complete · about five minutes</p></div>
      <button class="btn2" data-act="tour">▶ Take the tour</button>
    </div>
    <div style="height:5px;border-radius:9px;background:var(--hover);margin:10px 0 6px;overflow:hidden"><i style="display:block;height:100%;width:${n/3*100}%;background:var(--ok);transition:.6s"></i></div>
    ${def.map((d,i)=>`<div class="step ${done[i]?'done':i===cur?'now':''}"><span class="num">${done[i]?'✓':i+1}</span><div style="flex:1"><p class="t" style="font-weight:500">${d[0]}</p><p class="muted" style="font-size:.84rem;margin-top:2px">${d[1]}</p></div>${done[i]?'<span class="pill ok">Done</span>':`<button class="${i===cur?'btn':'btn2'}" data-act="${d[3]}">${d[2]}</button>`}</div>`).join('')}
  </div>

  <div class="grid g4 a d3" style="margin-top:14px">
    ${[['Runs',runs,'Last 14 days'],['Success rate',runs?'100%':'—',runs?'All runs succeeded':'No finished runs yet'],['Spend','$0.00','This month'],['Open tickets',open,'0 past SLA']].map(s=>`<div class="card sm stat"><p class="muted" style="font-size:.85rem">${s[0]}</p><b>${s[1]}</b><p class="muted" style="font-size:.74rem;margin-top:4px">${s[2]}</p></div>`).join('')}
  </div>

  <div class="grid g53 a d4" style="margin-top:14px">
    <div class="card"><p style="font-weight:600">Runs</p><p class="muted" style="font-size:.85rem;margin-top:3px">${runs?'Last 14 days':'Your last 14 days will appear here once an agent or workflow runs.'}</p>
      <div class="bars">${days.map(v=>`<i class="${v?'':'z'}" style="height:${v?Math.max(12,v/mx*100):3}%"></i>`).join('')}</div><div class="days">${days.map((_,i)=>`<span>${i%3===0?(new Date(Date.now()-(13-i)*864e5)).getDate():''}</span>`).join('')}</div></div>
    <div class="card"><p style="font-weight:600;margin-bottom:6px">Help &amp; support</p>
      <button class="helprow" data-act="tour"><span>Quick start tour</span><span class="ar">→</span></button>
      <button class="helprow" data-act="toast:Documentation opens here"><span>Read the documentation</span><span class="ar">→</span></button>
      <button class="helprow" data-act="toast:Support opens here"><span>Contact support</span><span class="ar">→</span></button>
      <button class="helprow" data-act="cmd"><span>Jump anywhere</span><span class="ar"><kbd>Ctrl</kbd> <kbd>K</kbd></span></button>
      <p class="muted" style="font-size:.72rem;margin-top:10px">Nexus v1.2.0</p></div>
  </div>`;
}

function viewSimple(n){
  const p=PAGES[n], items=S.data[p.key];
  const tabs=p.tabs?`<div class="tabs a d2">${p.tabs.map((t,i)=>`<button class="${i?'':'on'}" data-act="toast:${t} view">${t}</button>`).join('')}</div>`:'';
  let inner;
  if(!items.length) inner=`<div class="card empty a d2">${emptyIco(n)}<h3>${p.emptyT}</h3><p>${p.emptyP}</p><button class="btn" data-act="new:${p.key}">${p.cta}</button></div>`;
  else inner=`<div class="card a d2">${items.map((it,i)=>`<div class="li"><div><p style="font-weight:500">${esc(it.name)}</p><p class="muted" style="font-size:.84rem">${esc(it.desc||'No description')}</p></div><div class="row">${p.key==='agents'?`<button class="btn" data-act="run:${i}">▶ Run</button>`:''}<button class="btn2" data-act="del:${p.key}:${i}">Delete</button></div></div>`).join('')}</div>`;
  return head(n,p.desc,`<button class="btn" data-act="new:${p.key}">+ ${p.cta}</button>`)+tabs+inner;
}

function viewTickets(){
  const t=S.data.tickets;
  const tiles=[['My tickets',t.length],['My groups',0],['Unassigned',0],['All open',t.length],['SLA breached',0],['Resolved',0]];
  return head('Tickets','Your ticket queues: incidents, alerts and requests to work, with SLA timers.','<button class="btn2" data-act="toast:Ticket settings">Settings</button><button class="btn" data-act="new:tickets">+ New ticket</button>')+
  `<div class="grid g3 a d2" style="grid-template-columns:repeat(6,1fr);gap:10px">${tiles.map(x=>`<div class="card sm stat" style="padding:14px"><p class="muted" style="font-size:.74rem">${x[0]}</p><b style="font-size:1.5rem">${x[1]}</b></div>`).join('')}</div>
  <div class="filters a d3" style="margin-top:18px">${['My tickets','Any severity','Any status','Any type','No grouping'].map(f=>`<span>${f}</span>`).join('')}</div>`+
  (t.length?`<div class="card a d3">${t.map((it,i)=>`<div class="li"><div><p style="font-weight:500">${esc(it.name)}</p><p class="muted" style="font-size:.84rem">${esc(it.desc||'')}</p></div><div class="row"><span class="pill">Open</span><button class="btn2" data-act="del:tickets:${i}">Resolve</button></div></div>`).join('')}</div>`
   :`<div class="card empty a d3">${emptyIco('Tickets')}<h3>Nothing assigned to you</h3><p>Pick up tickets from your groups' queues or the unassigned pool.</p><button class="btn" data-act="new:tickets">New ticket</button></div>`);
}

let actTab='Runs';
function viewActivity(){
  const runs=S.runs.slice().reverse();
  return head('Activity','Every agent, team and workflow execution, live.')+
  `<div class="tabs a d2">${['Runs','Events'].map(t=>`<button class="${t===actTab?'on':''}" data-act="acttab:${t}">${t}</button>`).join('')}</div>
  <div class="filters a d2">${['All statuses','Agents, teams & workflows','Any trigger','Show model test runs'].map(f=>`<span>${f}</span>`).join('')}</div>`+
  (actTab==='Runs'&&runs.length?`<div class="card a d3">${runs.map(r=>`<div class="li"><div><p style="font-weight:500">${esc(r.name)}</p><p class="muted" style="font-size:.84rem">Manual run · ${ago(r.t)}</p></div><span class="pill ok">Succeeded</span></div>`).join('')}</div>`
   :`<div class="card empty a d3">${emptyIco('Activity')}<h3>${actTab==='Runs'?'No runs match':'No events yet'}</h3><p>${actTab==='Runs'?'Runs appear here as soon as an agent or workflow starts.':'Events such as triggers firing and alerts show up here.'}</p></div>`);

let toolTab='MCP servers';
function viewTools(){
  const [t,p,c]=TOOL_TABS[toolTab];
  return head('Tools','What agents and workflows work with and what starts them: MCP servers, your own HTTP APIs and connections, triggers, encrypted secrets and shared variables.')+
  `<div class="tabs a d2">${Object.keys(TOOL_TABS).map(x=>`<button class="${x===toolTab?'on':''}" data-act="tooltab:${x}">${x}</button>`).join('')}</div>
  <div class="card empty a d3">${emptyIco('Tools')}<h3>${t}</h3><p>${p}</p><button class="btn" data-act="toast:${c} — coming in the full build">${c}</button></div>`;

let setTab='Providers';
function viewSettings(){
  let inner;
  if(setTab==='Providers') inner=`<div class="grid g2">${PROVIDERS.map(([n,h])=>`<div class="card sm"><p style="font-weight:600">${n}</p><p class="muted" style="font-size:.8rem;margin:4px 0 16px;min-height:34px">${h}</p>${S.provider===n?'<span class="pill ok">Connected</span> <button class="btn2" data-act="disc" style="margin-left:6px">Disconnect</button>':`<button class="btn" data-act="connect:${n}">Connect</button>`}</div>`).join('')}</div>`;
  else inner=`<div class="card empty">${emptyIco('Settings')}<h3>${setTab}</h3><p>${SETTINGS[setTab]}</p></div>`;
  return head('Settings','Providers, budgets, integrations and access for this Nexus instance.')+
  `<div class="setgrid a d2"><div class="setnav">${Object.keys(SETTINGS).map(k=>`<button class="${k===setTab?'on':''}" data-act="settab:${k}">${k}</button>`).join('')}</div><div>${inner}</div></div>`;
}

const VIEWS={Dashboard:viewDashboard,Tickets:viewTickets,Activity:viewActivity,Tools:viewTools,Settings:viewSettings};
let current='Dashboard';
function render(){
  const h=location.hash.replace('#/','');
  current=names.find(n=>n.toLowerCase()===h)||'Dashboard';
  $('#page').innerHTML=(VIEWS[current]||(()=>viewSimple(current)))();
  markNav(current); document.title='Nexus · '+current;
}
window.addEventListener('hashchange',()=>{closeAll();window.scrollTo(0,0);render()});

/* ================= modals ================= */
function openSheet(html,w){closeSheet();const s=document.createElement('div');s.className='scrim';s.id='scrim';s.innerHTML=`<div class="sheet ${w||''}">${html}</div>`;s.addEventListener('mousedown',e=>{if(e.target===s)closeSheet()});document.body.appendChild(s);const i=s.querySelector('input');i&&i.focus();return s}
function closeSheet(){const s=$('#scrim');s&&s.remove()}
function closeAll(){closeSheet();$('#pop').style.display='none'}

function newItem(key){
  const label=(Object.values(PAGES).find(p=>p.key===key)||{one:'ticket'}).one;
  const s=openSheet(`<h3>New ${label}</h3><p class="muted" style="font-size:.85rem;margin-top:4px">${key==='agents'?'Give it a name and a role. You can refine tools and models later.':'Just a name for now — you can add detail later.'}</p>
    <label class="fld">Name<input id="f-name" placeholder="${key==='agents'?'e.g. Support triage':'Name'}"></label>
    <label class="fld">${key==='agents'?'Role':'Description'}<textarea id="f-desc" rows="3" placeholder="${key==='agents'?'What is this agent responsible for?':'Optional'}"></textarea></label>
    <div class="row" style="margin-top:20px;justify-content:flex-end"><button class="btn2" data-act="close">Cancel</button><button class="btn" id="f-ok">Create</button></div>`);
  const go=()=>{const n=s.querySelector('#f-name').value.trim();if(!n){s.querySelector('#f-name').focus();return}
    S.data[key].push({name:n,desc:s.querySelector('#f-desc').value.trim()});save();closeSheet();toast('Created “'+n+'”');render();};
  s.querySelector('#f-ok').onclick=go; s.querySelector('#f-name').addEventListener('keydown',e=>e.key==='Enter'&&go());
}
function connect(name){
  const s=openSheet(`<h3>Connect ${esc(name)}</h3><p class="muted" style="font-size:.85rem;margin-top:4px">This is a prototype — nothing is stored or sent. Any text works.</p>
    <label class="fld">API key<input id="f-key" type="password" placeholder="Paste a key (not saved)" autocomplete="off"></label>
    <div class="row" style="margin-top:20px;justify-content:flex-end"><button class="btn2" data-act="close">Cancel</button><button class="btn" id="f-ok">Connect</button></div>`);
  s.querySelector('#f-ok').onclick=()=>{S.provider=name;save();closeSheet();toast(name+' connected');render()};
}

/* command palette */
function openCmd(){
  const acts=[...names.map(n=>({t:n,s:desc[n],ic:n,go:()=>location.hash=route(n)})),
    {t:'New agent',s:'Create',ic:'Agents',go:()=>{location.hash='#/agents';setTimeout(()=>newItem('agents'),50)}},
    {t:'Take the quick start tour',s:'Help',ic:'Dashboard',go:()=>startTour()}];
  const s=openSheet(`<input id="q" placeholder="Search pages and actions…" autocomplete="off"><div class="res"></div>`,'cmd');
  const res=s.querySelector('.res'),q=s.querySelector('#q');let sel=0,list=[];
  const draw=()=>{const v=q.value.toLowerCase();list=acts.filter(a=>(a.t+a.s).toLowerCase().includes(v));sel=Math.min(sel,Math.max(0,list.length-1));
    res.innerHTML=list.map((a,i)=>`<button class="${i===sel?'on':''}" data-i="${i}">${svg(a.ic)}<span>${a.t}</span><small>${a.s}</small></button>`).join('')||'<p class="muted" style="padding:16px;font-size:.88rem">No matches</p>'};
  draw();q.addEventListener('input',()=>{sel=0;draw()});
  q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){sel=Math.min(list.length-1,sel+1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);draw();e.preventDefault()}else if(e.key==='Enter'&&list[sel]){closeSheet();list[sel].go()}});
  res.addEventListener('click',e=>{const b=e.target.closest('button');if(b){const a=list[+b.dataset.i];closeSheet();a.go()}});
}

/* help popover */
function toggleHelp(){const p=$('#pop');if(p.style.display==='block'){p.style.display='none';return}
  p.innerHTML=`<button data-act="tour"><span>Quick start tour</span><span class="muted">▶</span></button><button data-act="toast:Documentation opens here"><span>Documentation</span><span class="muted">↗</span></button><button data-act="toast:Support opens here"><span>Contact support</span><span class="muted">↗</span></button><button data-act="cmd"><span>Search</span><span><kbd>Ctrl</kbd> <kbd>K</kbd></span></button><p class="muted" style="font-size:.72rem;padding:8px 12px 4px">Nexus v1.2.0</p>`;
  p.style.display='block'}

/* ================= tour ================= */
const TOUR=[
  {t:'Welcome to Nexus',p:'A 60-second tour of where everything lives. You can skip at any time and reopen it from the help button.',sel:null},
  {t:'Everything is one tap away',p:()=>document.documentElement.classList.contains('frost')?'This dock holds every area: Agents, Workflows, Tickets and more. Hover an icon to see what it does.':'This rail holds every area: Agents, Workflows, Tickets and more. Hover an icon to see what it does.',sel:()=>document.documentElement.classList.contains('frost')?'#dock':'#rail',nav:'#/dashboard'},
  {t:'Jump anywhere',p:'Press Ctrl K at any time to search pages and run actions without touching the mouse.',sel:'#searchBtn'},
  {t:'Your three-step checklist',p:'Connect a provider, create an agent, then run it. Each step ticks off by itself as you go.',sel:'#checklist',nav:'#/dashboard'},
  {t:'Help is always here',p:'The help button reopens this tour and links to documentation and support.',sel:'#helpBtn'},
  {t:'You\'re ready',p:'Start with step 1: connect an LLM provider. Everything else builds from there.',sel:null,last:true}
];
let ti=0;
function startTour(){closeAll();if(location.hash!=='#/dashboard'&&location.hash!=='')location.hash='#/dashboard';ti=0;$('#tour').style.display='block';setTimeout(showStep,60)}
function endTour(done){$('#tour').style.display='none';S.tourDone=true;save();if(done)toast('Tour complete — start with step 1')}
function showStep(){
  const st=TOUR[ti], card=$('#tcard'), hole=$('#hole');
  const sel=typeof st.sel==='function'?st.sel():st.sel, el=sel&&$(sel);
  const body=typeof st.p==='function'?st.p():st.p;
  card.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="dots">${TOUR.map((_,i)=>`<i class="${i===ti?'on':''}"></i>`).join('')}</div><span class="muted" style="font-size:.72rem">${ti+1} / ${TOUR.length}</span></div>
    <h4>${st.t}</h4><p>${body}</p>
    <div class="row" style="margin-top:18px;justify-content:space-between"><button class="btn2" data-act="tour-skip">${st.last?'Close':'Skip'}</button><div class="row">${ti>0?'<button class="btn2" data-act="tour-back">Back</button>':''}<button class="btn" data-act="tour-next">${st.last?'Get started':'Next'}</button></div></div>`;
  const place=()=>{
    const cw=card.offsetWidth,ch=card.offsetHeight,vw=innerWidth,vh=innerHeight;
    if(el){el.scrollIntoView({block:'center'});const r=el.getBoundingClientRect(),pad=8;
      Object.assign(hole.style,{left:r.left-pad+'px',top:r.top-pad+'px',width:r.width+pad*2+'px',height:r.height+pad*2+'px',boxShadow:'0 0 0 9999px rgba(0,0,0,.58)'});
      let x=Math.min(Math.max(16,r.left+r.width/2-cw/2),vw-cw-16),y=r.bottom+pad+16;
      if(y+ch>vh-16){y=r.top-pad-16-ch}
      if(y<16){y=Math.min(vh-ch-16,Math.max(16,r.top))}
      if(r.width<120&&r.height>200){x=Math.min(vw-cw-16,r.right+24);y=Math.max(16,Math.min(vh-ch-16,r.top+r.height/2-ch/2))}
      card.style.left=x+'px';card.style.top=y+'px';
    }else{Object.assign(hole.style,{left:vw/2+'px',top:vh/2+'px',width:'0px',height:'0px',boxShadow:'0 0 0 9999px rgba(0,0,0,.58)'});card.style.left=(vw-cw)/2+'px';card.style.top=(vh-ch)/2+'px'}
  };
  if(st.nav&&location.hash!==st.nav){location.hash=st.nav;setTimeout(place,120)}else requestAnimationFrame(()=>setTimeout(place,40));
}
addEventListener('resize',()=>{if($('#tour').style.display==='block')showStep()});

/* ================= actions ================= */
document.addEventListener('click',e=>{
  const th=e.target.closest('[data-theme]');if(th){setTheme(th.dataset.theme);return}
  const b=e.target.closest('[data-act]');
  if(!b){const p=$('#pop');if(p.style.display==='block'&&!e.target.closest('#pop'))p.style.display='none';return}
  const [a,x,y]=b.dataset.act.split(':'); const arg=b.dataset.act.slice(a.length+1);
  switch(a){
    case 'cmd':closeAll();openCmd();break;
    case 'help':e.stopPropagation();toggleHelp();break;
    case 'tour':startTour();break;
    case 'tour-next':if(TOUR[ti].last){endTour(true);location.hash='#/dashboard'}else{ti++;showStep()}break;
    case 'tour-back':ti=Math.max(0,ti-1);showStep();break;
    case 'tour-skip':endTour(false);break;
    case 'toast':$('#pop').style.display='none';toast(arg);break;
    case 'close':closeSheet();break;
    case 'new':newItem(x);break;
    case 'del':S.data[x].splice(+y,1);save();render();break;
    case 'run':{const ag=S.data.agents[+x];S.runs.push({name:ag.name,t:Date.now()});save();toast('Ran “'+ag.name+'” — succeeded');render();break}
    case 'run-first':if(!S.data.agents.length){location.hash='#/agents';toast('Create an agent first')}else{const ag=S.data.agents[0];S.runs.push({name:ag.name,t:Date.now()});save();toast('Ran “'+ag.name+'” — succeeded');render()}break;
    case 'new-agent':location.hash='#/agents';setTimeout(()=>newItem('agents'),60);break;
    case 'provider':setTab='Providers';location.hash='#/settings';render();break;
    case 'connect':connect(arg);break;
    case 'disc':S.provider=null;save();render();break;
    case 'settab':setTab=arg;render();break;
    case 'tooltab':toolTab=arg;render();break;
    case 'acttab':actTab=arg;render();break;
  }
});
addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();closeAll();openCmd()}
  if(e.key==='Escape'){closeAll();if($('#tour').style.display==='block')endTour(false)}
  if($('#tour').style.display==='block'){if(e.key==='ArrowRight')$('#tcard [data-act=tour-next]')?.click();if(e.key==='ArrowLeft')$('#tcard [data-act=tour-back]')?.click()}
});

/* ================= theme ================= */
function setTheme(t){
  S.theme=t;save();const h=document.documentElement;h.classList.remove('frost','lava');h.classList.add(t);
  document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.theme===t));
  const v=$('#lava');if(t==='lava'){v.playbackRate=.35;v.play().catch(()=>{})}else v.pause();
  if($('#tour').style.display==='block')showStep();
}

/* ================= boot ================= */
buildNav();setTheme('frost');render();
$('#lava').addEventListener('loadedmetadata',e=>e.target.playbackRate=.35);
startTour(); // demo pages: the walkthrough opens straight away on every visit
</script>

<div id="music" role="group" aria-label="Music player">
  <div class="vid"><div id="ytp"></div></div>
  <div class="meta"><span class="t">Lean Back</span><span class="a" id="mstate">Tap anywhere to play</span></div>
  <button id="mbtn" aria-label="Mute music" title="Mute / unmute"></button>
</div>
<script>
(function(){
  var ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>';
  var OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>';
  var p,ready=false,muted=false,started=false,btn=document.getElementById('mbtn'),st=document.getElementById('mstate');
  function ui(){btn.innerHTML=muted?OFF:ON;btn.setAttribute('aria-label',muted?'Unmute music':'Mute music');st.textContent=started?(muted?'Muted':'Fat Joe, Remy Ma'):'Tap anywhere to play'}
  function go(){if(!ready||started&&!muted&&p.getPlayerState()===1)return;try{p.unMute();p.setVolume(70);p.playVideo()}catch(e){}}
  var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
  window.onYouTubeIframeAPIReady=function(){
    p=new YT.Player('ytp',{width:'96',height:'54',videoId:'j-1rhtVj8_0',playerVars:{autoplay:1,loop:1,playlist:'j-1rhtVj8_0',controls:0,playsinline:1,rel:0,modestbranding:1},
      events:{onReady:function(){ready=true;p.setVolume(70);p.playVideo()},
        onStateChange:function(e){if(e.data===1){started=true;ui()}if(e.data===0)p.playVideo()}}})};
  ['pointerdown','keydown','touchstart'].forEach(function(ev){window.addEventListener(ev,function f(){if(started&&p&&p.getPlayerState&&p.getPlayerState()===1){window.removeEventListener(ev,f);return}go()},{passive:true})});
  btn.addEventListener('click',function(e){e.stopPropagation();if(!ready)return;muted=!muted;if(muted)p.mute();else{p.unMute();p.playVideo()}ui()});
  btn.addEventListener('pointerdown',function(e){e.stopPropagation()});
  ui();
})();
</script>
