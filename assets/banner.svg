<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b10"/><stop offset="1" stop-color="#0d1a1a"/></linearGradient>
<pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#39ff8c" stroke-opacity=".10"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:'Arial Black',Impact,'Segoe UI',sans-serif}
.m{font-family:Consolas,'SF Mono',Menlo,monospace;font-weight:700}
.scan{animation:scan 5s linear infinite}
@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(440px)}}
.grid{animation:gr 3s linear infinite}
@keyframes gr{from{transform:translateY(0)}to{transform:translateY(60px)}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:eq 1.3s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.k{opacity:0;animation:kw 12s infinite}
@keyframes kw{0%{opacity:0;transform:translateY(14px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0}}
.type{clip-path:inset(0 100% 0 0);animation:ty 3.2s steps(26) .3s forwards}
@keyframes ty{to{clip-path:inset(0 0 0 0)}}
.cur{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.pulse{animation:pl 1.3s ease-in-out infinite}@keyframes pl{50%{opacity:.4}}
</style>
<rect width="1280" height="400" fill="url(#bg)"/>
<g class="grid"><rect y="-60" width="1280" height="520" fill="url(#grid)"/></g>
<text x="60" y="170" font-size="84" fill="#f5f5f5" filter="url(#glow)">Gustavo <tspan fill="#ffd60a">Freitas</tspan></text>
<text class="m" x="60" y="222" font-size="26" fill="#00e5ff">&gt; <tspan class="type">customer success engineer</tspan><tspan class="cur" fill="#39ff8c">_</tspan></text>
<g font-size="40" fill="#39ff8c" filter="url(#glow)">
<text class="k" x="60" y="296" style="animation-delay:0s">SOAR &amp; Security Automation</text>
<text class="k" x="60" y="296" fill="#ffd60a" style="animation-delay:3s">Incident Response . GIAC GCIH</text>
<text class="k" x="60" y="296" fill="#ff2daa" style="animation-delay:6s">Enterprise customers at Torq</text>
<text class="k" x="60" y="296" fill="#00e5ff" style="animation-delay:9s">Part tool. Part art.</text>
</g>
<text class="m" x="60" y="360" font-size="18" fill="#88aaaa">github.com/Tootenramen</text>
<g fill-opacity=".85">
<rect class="bar" x="900" y="120" width="22" height="180" fill="#39ff8c" style="animation-delay:0s"/>
<rect class="bar" x="934" y="120" width="22" height="180" fill="#00e5ff" style="animation-delay:.15s"/>
<rect class="bar" x="968" y="120" width="22" height="180" fill="#ffd60a" style="animation-delay:.3s"/>
<rect class="bar" x="1002" y="120" width="22" height="180" fill="#ff2daa" style="animation-delay:.45s"/>
<rect class="bar" x="1036" y="120" width="22" height="180" fill="#39ff8c" style="animation-delay:.6s"/>
<rect class="bar" x="1070" y="120" width="22" height="180" fill="#00e5ff" style="animation-delay:.75s"/>
<rect class="bar" x="1104" y="120" width="22" height="180" fill="#ffd60a" style="animation-delay:.9s"/>
<rect class="bar" x="1138" y="120" width="22" height="180" fill="#ff2daa" style="animation-delay:1.05s"/>
</g>
<text class="m" x="900" y="335" font-size="15" fill="#88aaaa">click for the full animated site</text>
<rect class="scan" width="1280" height="40" fill="#39ff8c" fill-opacity=".05"/>
</svg>
